<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page-shown record. The first instant this document was not visible
         (performance.now() ms), kept on window.__equinFirstHiddenAt
         (boot-trace's FIRST_HIDDEN_GLOBAL) by a listener installed while the
         head parses — before any module runs. A load timing read once the app
         has booted (the site's slow-load report, analytics' load) cannot see a
         hide that happened before it subscribed; this record can, in every
         browser. Read by boot-trace's readPageShown. -->
    <script id="page-shown">
      (function () {
        function seen() {
          if (document.visibilityState === "visible") return;
          window.__equinFirstHiddenAt = performance.now();
          document.removeEventListener("visibilitychange", seen);
        }
        document.addEventListener("visibilitychange", seen);
        seen();
      })();
    </script>
    <!-- First-frame color scheme floor. The theme itself arrives with this
         document: the gateway splices the server-rendered theme CSS (and the
         desktop's `data-color-scheme`) in at the end of the head — see
         shell/document-head and theme-engine/server — so nothing here reads
         browser storage. This only covers a shell served without that
         fragment (a backend that has never booted, e.g. a first launch): the
         canvas must be dark — the configured color mode's default — until
         ThemeInjector mounts, with nothing but this file. The global
         stylesheet (app.css: `html { background: Canvas }` under
         `[data-color-scheme] { color-scheme }`) does NOT block the first paint
         (web-artifacts compose), so it cannot be what makes it dark: the
         `color-scheme` meta does, as the UA's own default canvas. A meta, not
         a style rule, so it never enters the cascade app.css and the theme
         own once they apply (an explicit `color-scheme` wins over it; with the
         theme fragment the canvas is painted explicitly anyway). The script
         gives app.css the same scheme to key on; the two must agree
         (web/__tests__/first-paint-floor.test.ts). -->
    <meta name="color-scheme" content="dark" />
    <script>
      document.documentElement.setAttribute("data-color-scheme", "dark");
    </script>
    <!-- React commit bridge. Generic, passive — NO profiler logic here.
         React's renderer reads `window.__REACT_DEVTOOLS_GLOBAL_HOOK__` exactly
         once, when `react-dom/client` initializes (before createRoot().render()).
         If the global is absent at that moment React never emits commit
         callbacks and nothing later can retro-register. So a minimal passive
         hook MUST exist before the module script below loads react-dom.
         This installs/augments that hook and exposes a `__commitSubscribers`
         Set; the render-profiler debug plugin subscribes on demand. Zero-cost
         when nobody subscribes: one empty-Set check per commit. If the real
         React DevTools extension already installed a hook, we augment it (wrap
         onCommitFiberRoot once) so both coexist. -->
    <script>
      (function () {
        var nextId = 1;
        var hook = window.__REACT_DEVTOOLS_GLOBAL_HOOK__;
        if (!hook) {
          var subs = new Set();
          hook = {
            supportsFiber: true,
            isDisabled: false,
            renderers: new Map(),
            __commitSubscribers: subs,
            __commitBridgeWrapped: true,
            inject: function (r) {
              var id = nextId++;
              this.renderers.set(id, r);
              return id;
            },
            checkDCE: function () {},
            onCommitFiberUnmount: function () {},
            onPostCommitFiberRoot: function () {},
            onScheduleFiberRoot: function () {},
            onCommitFiberRoot: function (rendererId, root) {
              if (subs.size) {
                subs.forEach(function (cb) {
                  try {
                    cb(root);
                  } catch (e) {
                    /* a subscriber must never break a React commit */
                  }
                });
              }
            },
          };
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = hook;
        } else {
          if (!hook.__commitSubscribers) {
            hook.__commitSubscribers = new Set();
          }
          if (!hook.__commitBridgeWrapped) {
            hook.__commitBridgeWrapped = true;
            var origCommit = hook.onCommitFiberRoot;
            hook.onCommitFiberRoot = function (rendererId, root) {
              var result;
              if (typeof origCommit === "function") {
                result = origCommit.apply(this, arguments);
              }
              var s = hook.__commitSubscribers;
              if (s && s.size) {
                s.forEach(function (cb) {
                  try {
                    cb(root);
                  } catch (e) {
                    /* a subscriber must never break a React commit */
                  }
                });
              }
              return result;
            };
          }
        }
      })();
    </script>
    <!-- Boot-failure screen. Plain DOM, NO plugin/React/theme dependency: it
         must work exactly when the entry module could not load. The bundle is
         an ES module graph; when any module in its STATIC import closure 404s
         (artifacts pruned from the shared cache, a half-written dist) the
         browser fails the whole graph - the entry never evaluates, nothing
         throws in JS, `#root` stays empty and the page is a blank screen with
         only "Failed to load resource" in the console. The one signal is the
         `error` event on the module <script> (capture phase: it does not
         bubble), so that is what this listens to - no timers. Failed URLs come
         from Resource Timing (the event itself does not name the dependency).
         Not for lazy plugin imports: App.tsx catches those (loadPlugins).
         The global stylesheet too: compose loads it without blocking render
         and keeps the page hidden until it applies, so a stylesheet that
         fails to load would otherwise leave the themed canvas up forever.
         A page of an OLDER build fails the same way once that build's files
         are gone (a site ship deletes the previous release; a tab restored or
         opened in the background holds the shell it fetched before): before
         showing anything, the shell is fetched again and its import map
         compared with this page's. A different one means a newer build is
         served, so the page reloads into it; the same one means the served
         build itself is missing files, and the screen says so. A reload can
         only follow a change of the served shell, so it cannot loop. -->
    <script id="boot-failure">
      (function () {
        var shown = false;
        function failedUrls(target) {
          var urls = [];
          performance.getEntriesByType("resource").forEach(function (r) {
            // responseStatus 0 with no body = network failure / blocked.
            if (r.responseStatus >= 400 || (r.responseStatus === 0 && r.decodedBodySize === 0 && r.transferSize === 0 && /\.(js|mjs|css)(\?|$)/.test(r.name))) {
              if (urls.indexOf(r.name) < 0) urls.push(r.name);
            }
          });
          var own = target.src || target.href;
          if (urls.length === 0 && own) urls.push(own);
          return urls;
        }
        function show(urls) {
          var root = document.getElementById("root");
          var box = document.createElement("div");
          box.id = "boot-failure-screen";
          box.setAttribute("role", "alert");
          box.style.cssText =
            "position:fixed;inset:0;overflow:auto;padding:32px;box-sizing:border-box;visibility:visible;" +
            "background:#1a0b0b;color:#f5e6e6;font:14px/1.5 system-ui,sans-serif;z-index:2147483647";
          var h = document.createElement("h1");
          h.style.cssText = "font-size:20px;margin:0 0 12px";
          h.textContent = "equin could not start: files of this build are missing";
          var p = document.createElement("p");
          p.style.cssText = "margin:0 0 12px;max-width:60em";
          p.textContent =
            urls.length + " file" + (urls.length === 1 ? "" : "s") +
            " could not be loaded (the server answered 404 or the request failed), so the app cannot run. " +
            "The build's artifacts were most likely removed. Rebuild this worktree with ./equin build, then reload.";
          var ul = document.createElement("ul");
          ul.style.cssText = "margin:0;padding-left:20px;font:12px/1.6 ui-monospace,monospace;word-break:break-all";
          urls.slice(0, 20).forEach(function (u) {
            var li = document.createElement("li");
            li.textContent = u;
            ul.appendChild(li);
          });
          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(ul);
          if (urls.length > 20) {
            var more = document.createElement("p");
            more.textContent = "... and " + (urls.length - 20) + " more.";
            box.appendChild(more);
          }
          (root && root.parentNode ? root.parentNode : document.body).appendChild(box);
        }
        // The boot files are the module scripts and stylesheets the served
        // document itself carries, from this origin: the entry and the global
        // stylesheet. Taken when parsing ends (readyState leaves "loading"),
        // before any module runs - so a stylesheet the app adds later (a web
        // font from fonts.googleapis.com a visitor's blocker refuses) is not
        // one: its failure is no reason to cover a running page with this
        // screen. While the document is still parsing, every element is its own.
        var BOOT_FILE = 'script[type="module"][src], link[rel="stylesheet"]';
        var bootFiles = null;
        function takeBootFiles() {
          bootFiles = Array.prototype.slice.call(document.querySelectorAll(BOOT_FILE));
        }
        if (document.readyState === "loading") {
          document.addEventListener("readystatechange", function parsed() {
            if (document.readyState === "loading") return;
            document.removeEventListener("readystatechange", parsed);
            takeBootFiles();
          });
        } else {
          takeBootFiles();
        }
        function isBootFile(t) {
          if (!t || typeof t.matches !== "function" || !t.matches(BOOT_FILE)) return false;
          if (bootFiles !== null && bootFiles.indexOf(t) < 0) return false;
          var url = t.getAttribute(t.tagName === "SCRIPT" ? "src" : "href");
          return !!url && new URL(url, location.href).origin === new URL(location.href).origin;
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (shown || !isBootFile(t)) return;
            shown = true;
            var urls = failedUrls(t);
            servedNewerBuild().then(
              function (newer) {
                if (newer) {
                  console.info("[boot] this page's build is no longer served; reloading into the current one:", urls);
                  location.reload();
                  return;
                }
                fail(urls);
              },
              function (err) {
                console.error("[boot] could not fetch the served shell to compare builds:", err);
                fail(urls);
              },
            );
          },
          true,
        );
        function importMapOf(doc) {
          var s = doc.querySelector('script[type="importmap"]');
          return s ? s.textContent : null;
        }
        // Whether the server now answers this URL with a shell of another
        // build: its import map (the build's content-addressed module URLs)
        // differs from the one this page booted with.
        function servedNewerBuild() {
          return fetch(location.href, { cache: "no-store", credentials: "same-origin" }).then(function (res) {
            if (!res.ok) throw new Error("the shell answered " + res.status);
            return res.text().then(function (text) {
              var served = importMapOf(new DOMParser().parseFromString(text, "text/html"));
              return served !== null && served !== importMapOf(document);
            });
          });
        }
        function fail(urls) {
          console.error("[boot] boot files failed to load:", urls);
          show(urls);
          // Same alert funnel as plugin-load failures (reports/plugin-load-errors).
          send({
            kind: "crash",
            source: "plugin-load",
            message: "boot: " + urls.length + " file(s) failed to load: " + urls.slice(0, 5).join(", "),
            url: location.href,
            userAgent: navigator.userAgent,
            data: { errorType: "BootModuleLoadFailed", stack: null, urls: urls.slice(0, 50) },
          });
        }
        // Before the app entry runs, nothing else can carry a report: a raw
        // POST. Once it has installed the page request guard
        // (__equinRequestGuardInstalled, request-guard's
        // REQUEST_GUARD_INSTALLED_GLOBAL) a raw POST is refused, and the app's
        // own reporter is (or soon will be) up: the report is queued for it on
        // __equinShellReports (reports/crash's SHELL_REPORT_QUEUE_GLOBAL), which
        // the crash collector drains through the page's report channel.
        function send(body) {
          if (window.__equinRequestGuardInstalled !== undefined) {
            (window.__equinShellReports = window.__equinShellReports || []).push(body);
            return;
          }
          fetch("/api/reports", {
            method: "POST",
            headers: { "content-type": "application/json" },
            keepalive: true,
            body: JSON.stringify(body),
          }).catch(function (err) {
            console.warn("[boot] failure report not delivered:", err);
          });
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon-small.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon_32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon_16x16.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon_512x512.png" />
    <title>equin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
