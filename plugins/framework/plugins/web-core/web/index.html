<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- First-frame color scheme floor. The theme itself arrives with this
         document: the gateway splices the server-rendered theme CSS (and the
         configured `.dark` class) in at the end of the head — see
         shell/document-head and theme-engine/server — so nothing here reads
         browser storage. This only covers a shell served without that
         fragment (a backend that has never booted): it paints the neutral
         loading floor (app.css: html { background: Canvas }) dark — the
         configured color mode's default — until ThemeInjector mounts. -->
    <script>
      document.documentElement.classList.add("dark");
    </script>
    <!-- React commit bridge. Generic, passive — NO profiler logic here.
         React's renderer reads `window.__REACT_DEVTOOLS_GLOBAL_HOOK__` exactly
         once, when `react-dom/client` initializes (before createRoot().render()).
         If the global is absent at that moment React never emits commit
         callbacks and nothing later can retro-register. So a minimal passive
         hook MUST exist before the module script below loads react-dom.
         This installs/augments that hook and exposes a `__commitSubscribers`
         Set; the render-profiler debug plugin subscribes on demand. Zero-cost
         when nobody subscribes: one empty-Set check per commit. If the real
         React DevTools extension already installed a hook, we augment it (wrap
         onCommitFiberRoot once) so both coexist. -->
    <script>
      (function () {
        var nextId = 1;
        var hook = window.__REACT_DEVTOOLS_GLOBAL_HOOK__;
        if (!hook) {
          var subs = new Set();
          hook = {
            supportsFiber: true,
            isDisabled: false,
            renderers: new Map(),
            __commitSubscribers: subs,
            __commitBridgeWrapped: true,
            inject: function (r) {
              var id = nextId++;
              this.renderers.set(id, r);
              return id;
            },
            checkDCE: function () {},
            onCommitFiberUnmount: function () {},
            onPostCommitFiberRoot: function () {},
            onScheduleFiberRoot: function () {},
            onCommitFiberRoot: function (rendererId, root) {
              if (subs.size) {
                subs.forEach(function (cb) {
                  try {
                    cb(root);
                  } catch (e) {
                    /* a subscriber must never break a React commit */
                  }
                });
              }
            },
          };
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = hook;
        } else {
          if (!hook.__commitSubscribers) {
            hook.__commitSubscribers = new Set();
          }
          if (!hook.__commitBridgeWrapped) {
            hook.__commitBridgeWrapped = true;
            var origCommit = hook.onCommitFiberRoot;
            hook.onCommitFiberRoot = function (rendererId, root) {
              var result;
              if (typeof origCommit === "function") {
                result = origCommit.apply(this, arguments);
              }
              var s = hook.__commitSubscribers;
              if (s && s.size) {
                s.forEach(function (cb) {
                  try {
                    cb(root);
                  } catch (e) {
                    /* a subscriber must never break a React commit */
                  }
                });
              }
              return result;
            };
          }
        }
      })();
    </script>
    <!-- Boot-failure screen. Plain DOM, NO plugin/React/theme dependency: it
         must work exactly when the entry module could not load. The bundle is
         an ES module graph; when any module in its STATIC import closure 404s
         (artifacts pruned from the shared cache, a half-written dist) the
         browser fails the whole graph - the entry never evaluates, nothing
         throws in JS, `#root` stays empty and the page is a blank screen with
         only "Failed to load resource" in the console. The one signal is the
         `error` event on the module <script> (capture phase: it does not
         bubble), so that is what this listens to - no timers. Failed URLs come
         from Resource Timing (the event itself does not name the dependency).
         Not for lazy plugin imports: App.tsx catches those (loadPlugins). -->
    <script id="boot-failure">
      (function () {
        var shown = false;
        function failedUrls(target) {
          var urls = [];
          performance.getEntriesByType("resource").forEach(function (r) {
            // responseStatus 0 with no body = network failure / blocked.
            if (r.responseStatus >= 400 || (r.responseStatus === 0 && r.decodedBodySize === 0 && r.transferSize === 0 && /\.(js|mjs)(\?|$)/.test(r.name))) {
              if (urls.indexOf(r.name) < 0) urls.push(r.name);
            }
          });
          if (urls.length === 0 && target.src) urls.push(target.src);
          return urls;
        }
        function show(urls) {
          var root = document.getElementById("root");
          var box = document.createElement("div");
          box.id = "boot-failure-screen";
          box.setAttribute("role", "alert");
          box.style.cssText =
            "position:fixed;inset:0;overflow:auto;padding:32px;box-sizing:border-box;" +
            "background:#1a0b0b;color:#f5e6e6;font:14px/1.5 system-ui,sans-serif;z-index:2147483647";
          var h = document.createElement("h1");
          h.style.cssText = "font-size:20px;margin:0 0 12px";
          h.textContent = "equin could not start: files of this build are missing";
          var p = document.createElement("p");
          p.style.cssText = "margin:0 0 12px;max-width:60em";
          p.textContent =
            urls.length + " module file" + (urls.length === 1 ? "" : "s") +
            " could not be loaded (the server answered 404 or the request failed), so the app cannot run. " +
            "The build's artifacts were most likely removed. Rebuild this worktree with ./equin build, then reload.";
          var ul = document.createElement("ul");
          ul.style.cssText = "margin:0;padding-left:20px;font:12px/1.6 ui-monospace,monospace;word-break:break-all";
          urls.slice(0, 20).forEach(function (u) {
            var li = document.createElement("li");
            li.textContent = u;
            ul.appendChild(li);
          });
          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(ul);
          if (urls.length > 20) {
            var more = document.createElement("p");
            more.textContent = "... and " + (urls.length - 20) + " more.";
            box.appendChild(more);
          }
          (root && root.parentNode ? root.parentNode : document.body).appendChild(box);
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (shown || !t || t.tagName !== "SCRIPT" || t.type !== "module") return;
            shown = true;
            var urls = failedUrls(t);
            console.error("[boot] module graph failed to load:", urls);
            show(urls);
            // Same alert funnel as plugin-load failures (reports/plugin-load-errors).
            fetch("/api/reports", {
              method: "POST",
              headers: { "content-type": "application/json" },
              keepalive: true,
              body: JSON.stringify({
                kind: "crash",
                source: "plugin-load",
                message: "boot: " + urls.length + " module file(s) failed to load: " + urls.slice(0, 5).join(", "),
                url: location.href,
                userAgent: navigator.userAgent,
                data: { errorType: "BootModuleLoadFailed", stack: null, urls: urls.slice(0, 50) },
              }),
            }).catch(function (err) {
              console.warn("[boot] failure report not delivered:", err);
            });
          },
          true,
        );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon_32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon_16x16.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon_512x512.png" />
    <title>equin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
