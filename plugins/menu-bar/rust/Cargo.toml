[package]
name = "equin-desktop"
version = "0.1.0"
description = "equin's native helper: the menu-bar / top-bar tray and its panel (tray mode), and one app's window (window mode)"
edition = "2021"
rust-version = "1.77"
publish = false

# A crate of its own (infra/deps' rust kind builds it with --locked), never a
# member of an enclosing workspace.
[workspace]

[[bin]]
name = "equin-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Renders icons/*.svg (the spiral, the one source of truth) into the PNGs the
# app compiles in — see build.rs.
resvg = "0.45"

[dependencies]
# macos-private-api (a no-op off macOS): a transparent window — the panel is a
# vibrancy material with rounded corners — needs private WKWebView API, and
# tauri-build reads the feature from this table. Fine for a helper that is
# never App Store distributed.
# custom-protocol: a production build. Without it Tauri compiles as `cfg(dev)`
# (what `tauri dev` runs), which on macOS sets the Dock icon at launch to the
# crate's icons/icon.png — so every installed app's shim would wear the equin
# spiral instead of its own bundle's app.icns once running.
tauri = { version = "2", features = ["image-png", "macos-private-api", "custom-protocol"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# The helper reads its instance's app catalog and icons (src/apps.rs) — the
# reqwest Tauri already links. No TLS feature: the instance is
# http://<ns>.localhost today; a hosted instance adds one.
reqwest = { version = "0.13", default-features = false }

# macOS: the status item is Tauri's own tray (NSStatusItem, template image).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
# A shim reads its own bundle's Info.plist (EquinAppId, EquinUrl) and the
# installed set from every shim's.
plist = "1"
# The app window's main-frame gate (src/main_frame.rs): a proxy in front of
# wry's WKNavigationDelegate — the same objc2 releases wry links.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKNavigationDelegate", "WKNavigationAction", "WKNavigationResponse", "WKFrameInfo", "WKWebView"] }

# Linux: a StatusNotifierItem over D-Bus, not libappindicator — so a left click
# is `Activate` (the panel) instead of a forced menu.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
# The app window's class / Wayland app id (glib prgname, gdk program class) —
# the gtk Tauri itself links, not a second one.
gtk = "0.18"
# The app window's main-frame gate (src/main_frame.rs): the response decision's
# main-frame flag (v2_40, which wry enables too).
webkit2gtk = { version = "2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
