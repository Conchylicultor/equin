<!doctype html>
<html lang="en" data-open="collapse" data-dblclick="zoom" data-widths="show">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miller columns — open &amp; resize behavior</title>
<meta name="description" content="How Miller columns make room when a pane opens, and what double-clicking a header does: today's behavior side by side with Finder-style scroll, proportional shrink and auto-collapse." />
<meta name="mocks" content="app:/agents" />
<meta name="prototype-option-group" content="Behavior" />
<meta name="prototype-option" content="open: collapse | scroll | shrink | current" />
<meta name="prototype-option" content="dblclick: zoom | focus | none" />
<meta name="prototype-option-group" content="Inspect" />
<meta name="prototype-option" content="widths: show | hide" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1d1d1f; background: #fff; -webkit-font-smoothing: antialiased;
  }
  #root { height: var(--prototype-screen-height, 100vh); }

  :root { --dur: 280ms; --ease: cubic-bezier(.33,1,.68,1); }
  .row { position: relative; height: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .track { display: flex; height: 100%; }

  .col {
    position: relative; flex: none; height: 100%; display: flex; flex-direction: column;
    overflow: hidden; background: #fff; border-right: 1px solid #e7e7ea;
  }
  .animated .col { transition: width var(--dur) var(--ease); }
  .col.root { background: #fafafb; }
  .col.last { border-right: none; }
  .col.flash::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 2px #7c6cff55; animation: flash 900ms ease-out forwards;
  }
  @keyframes flash { from { opacity: 1 } to { opacity: 0 } }

  .body { flex: 1; min-height: 0; overflow-y: auto; min-width: 0; }
  .enter > * { animation: enter 280ms cubic-bezier(.33,1,.68,1) backwards; }
  @keyframes enter { from { opacity: 0; transform: translateX(36px) } }

  .head {
    flex: none; height: 40px; display: flex; align-items: center; gap: 6px;
    padding: 0 8px 0 14px; border-bottom: 1px solid #ececef; user-select: none; cursor: default;
  }
  .head .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .px {
    flex: none; font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a8a93;
    padding: 3px 5px; border-radius: 4px; background: #f1f1f4;
  }
  .px.changed { color: #5b45f5; background: #eeebff; }
  :root[data-widths="hide"] .px { display: none; }
  .iconbtn {
    flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent;
    color: #8a8a93; display: grid; place-items: center; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .iconbtn:hover { background: #f0f0f3; color: #1d1d1f; }
  .zoomed-tag { flex: none; font-size: 11px; color: #5b45f5; }

  .col.bar { background: #f3f3f6; }
  .barbtn {
    width: 32px; height: 100%; border: 0; background: transparent; color: #6b6b74; cursor: pointer; padding: 10px 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px; overflow: hidden; animation: fadein 160ms ease-out;
  }
  .barbtn:hover { background: #ebebf0; color: #1d1d1f; }
  .inner { flex: none; height: 100%; display: flex; flex-direction: column; }
  .unfold { animation: fadein 200ms ease-out; }
  @keyframes fadein { from { opacity: 0 } }
  .animated.dragging .col { transition: none; }
  .bar .vt { writing-mode: vertical-rl; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .auto { writing-mode: vertical-rl; font-size: 10px; color: #9a9aa3; }
  :root[data-widths="hide"] .bar .auto { display: none; }

  .divider { position: absolute; top: 0; bottom: 0; right: -3px; width: 7px; cursor: col-resize; z-index: 2; }
  .divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: transparent; }
  .divider:hover::before, .divider.dragging::before { background: #7c6cff88; }
  .divider .chev {
    position: absolute; top: 8px; left: -7px; width: 20px; height: 20px; border-radius: 6px;
    border: 1px solid #e2e2e6; background: #fff; color: #6b6b74; font-size: 12px; line-height: 1;
    display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity 120ms;
  }
  .divider:hover .chev { opacity: 1; }

  .item {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer;
    border-radius: 0; white-space: nowrap; overflow: hidden;
  }
  .item:hover { background: #f2f2f5; }
  .item.active { background: #ebe8ff; }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .muted { color: #8a8a93; }
  .small { font-size: 12px; }
  .section { padding: 14px 16px 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #8a8a93; }
  .prose { padding: 12px 16px; color: #3a3a40; }
  .msg { padding: 10px 16px; }
  .msg .who { font-size: 11px; font-weight: 600; color: #8a8a93; margin-bottom: 3px; }
  .msg.user .bubble { background: #f3f3f6; border-radius: 10px; padding: 8px 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; margin: 0 2px; padding: 1px 6px; border-radius: 5px;
    background: #f1effe; color: #4b36e0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer;
  }
  .chip:hover { background: #e4dfff; }
  .chip.active { background: #5b45f5; color: #fff; }
  .chip.task { font-family: inherit; }
  pre.code { margin: 0; padding: 12px 0; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #333; }
  pre.code .ln { display: inline-block; width: 44px; text-align: right; padding-right: 14px; color: #b4b4bb; user-select: none; }
  .k { color: #a626a4 } .s { color: #50a14f } .c { color: #a0a1a7; font-style: italic }

  .report {
    position: absolute; left: 12px; bottom: 12px; z-index: 5; max-width: min(520px, calc(100% - 24px));
    background: #1d1d1fee; color: #f4f4f6; border-radius: 10px; padding: 9px 12px; font-size: 12px;
    box-shadow: 0 6px 24px #0003; pointer-events: none; animation: rise 200ms ease-out;
  }
  .report .line { display: flex; gap: 8px; align-items: baseline; }
  .report .tag { flex: none; width: 54px; color: #a9a9b3; font-size: 11px; }
  .report .bad { color: #ffb4a8; } .report .good { color: #a8f0c0; }
  :root[data-widths="hide"] .report { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useLayoutEffect, useEffect, useMemo } = React;
const OPT = document.documentElement.dataset;
const MODE = OPT.open;          // collapse | scroll | shrink | current
const DBL = OPT.dblclick;       // zoom | focus | none (ignored by `current`)

// ---------------------------------------------------------------- data
const KINDS = {
  tasks: { w: 300, title: () => "Tasks" },
  task:  { w: 440, title: (r) => TASKS[r].title },
  conv:  { w: 560, title: (r) => CONVS[r].title },
  file:  { w: 520, title: (r) => r.split("/").pop() },
};
const BAR = 32, MIN = 240, LEAF_MIN = 200;
const DURATION = 280;
// The CSS width transition's curve, cubic-bezier(.33,1,.68,1), in JS — the row's
// scroll glides on the same curve, so the scroll and the widths move as one.
const EASE = (() => {
  const [x1, y1, x2, y2] = [0.33, 1, 0.68, 1];
  const b = (t, a, c) => 3 * a * t * (1 - t) ** 2 + 3 * c * t * t * (1 - t) + t ** 3;
  return (x) => {
    let lo = 0, hi = 1;
    for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (b(m, x1, x2) < x) lo = m; else hi = m; }
    return b((lo + hi) / 2, y1, y2);
  };
})();
function glide(el, to) {
  const from = el.scrollLeft;
  if (Math.abs(to - from) < 1) return undefined;
  const t0 = performance.now();
  let raf;
  const step = (now) => {
    const p = Math.min(1, (now - t0) / DURATION);
    el.scrollLeft = from + (to - from) * EASE(p);
    if (p < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return () => cancelAnimationFrame(raf);
}
const STATUS = { "In progress": "#7c6cff", Todo: "#c4c4cc", Review: "#f0a43a", Done: "#3cb371" };

const TASKS = {
  t1: { title: "Audit Miller columns open behavior", status: "In progress", convs: ["c1", "c2"], subs: ["t2", "t3"] },
  t2: { title: "Stop persisting the auto 50/50 split", status: "Todo", convs: ["c3"], subs: [] },
  t3: { title: "Clear maximize on navigation", status: "Review", convs: ["c4"], subs: [] },
  t4: { title: "Theme customizer: radius presets", status: "In progress", convs: ["c5"], subs: ["t5"] },
  t5: { title: "Radius token migration", status: "Todo", convs: ["c6"], subs: [] },
  t6: { title: "Mail: thread snooze", status: "Done", convs: ["c7"], subs: [] },
  t7: { title: "Places map pin clustering", status: "Review", convs: ["c8"], subs: [] },
  t8: { title: "Backup: retry dispatch to S3", status: "Todo", convs: ["c9"], subs: [] },
};
const FILES = ["plugins/layouts/plugins/miller/web/components/column.tsx", "plugins/layouts/plugins/miller/web/hooks/use-column-widths.ts", "plugins/layouts/plugins/miller/web/components/miller-columns.tsx", "plugins/layouts/plugins/miller/web/hooks/use-column-maximize.ts"];
const CONVS = {};
["c1","c2","c3","c4","c5","c6","c7","c8","c9"].forEach((id, i) => {
  CONVS[id] = {
    title: ["Audit the open paths", "Prototype the layouts", "Drop persisted split", "Maximize cleanup", "Radius presets", "Token rename", "Snooze UI", "Clustering", "S3 retry"][i],
    msgs: [
      { who: "user", text: "Look at how the columns make room when a new one opens." },
      { who: "agent", text: "The width comes from three places — the leaf flex-fill, the stored width, and the first-open split:", files: [FILES[0], FILES[1]] },
      { who: "agent", text: "The scroll-into-view runs only when the chain grows:", files: [FILES[2]], task: "t2" },
      { who: "user", text: "And maximize?" },
      { who: "agent", text: "It never clears on navigation — see", files: [FILES[3]], task: "t3" },
    ],
  };
});

// ---------------------------------------------------------------- layout engine
// Every column gets a pixel width; the row scrolls when their sum exceeds the
// viewport. One function per strategy, so the options compare like for like.
let nextUid = 1;
const slot = (kind, ref) => ({ uid: nextUid++, kind, ref });
const sum = (cols) => cols.reduce((a, c) => a + c.w, 0);

function layout(s, W) {
  const n = s.chain.length;
  const pref = (c) => s.widths[c.kind] ?? KINDS[c.kind].w;

  if (MODE === "current") {
    // Faithful to miller today: non-leaf = stored ?? default, leaf = what is
    // left (≥200), collapse keyed by pane KIND, maximize sticky across opens.
    const cols = s.chain.map((c, i) => {
      const last = i === n - 1;
      const bar = s.max !== null ? s.max !== c.uid : !last && s.kindCollapsed.has(c.kind);
      return { c, bar, fill: s.max !== null ? s.max === c.uid : last, w: bar ? BAR : pref(c) };
    });
    const fixed = sum(cols.filter((x) => !x.fill));
    cols.forEach((x) => { if (x.fill) x.w = Math.max(LEAF_MIN, W - fixed); });
    return cols;
  }

  const cols = s.chain.map((c, i) => ({ c, bar: i < n - 1 && s.collapsed.has(c.uid), w: pref(c) }));
  const leaf = cols[n - 1];
  const settle = () => cols.forEach((x) => { if (x.bar) x.w = BAR; });

  if (s.max !== null && cols.some((x) => x.c.uid === s.max)) {
    cols.forEach((x) => { x.bar = x.c.uid !== s.max; });
    settle();
    const m = cols.find((x) => !x.bar);
    m.w = Math.max(m.w, W - sum(cols.filter((x) => x.bar)));
    return cols;
  }
  if (s.focus !== null) {
    const fi = cols.findIndex((x) => x.c.uid === s.focus);
    cols.forEach((x, i) => { if (i < fi) { x.bar = true; x.auto = "focus"; } });
  }
  settle();

  // Proportional give, down to MIN: the columns left of the leaf first, then the leaf.
  const shrink = () => {
    let over = sum(cols) - W;
    const give = cols.filter((x, i) => !x.bar && i < n - 1);
    const room = give.reduce((a, x) => a + Math.max(0, x.w - MIN), 0);
    if (over > 0 && room > 0) {
      const k = Math.min(1, over / room);
      give.forEach((x) => { x.w = Math.round(x.w - Math.max(0, x.w - MIN) * k); });
      over = sum(cols) - W;
    }
    if (over > 0) leaf.w = Math.max(MIN, leaf.w - over);
  };
  if (MODE === "shrink") shrink();

  if (MODE === "collapse") {
    // Oldest first, never the column the open came from, never one the user
    // just expanded. Auto bars come back by themselves when room returns.
    for (let i = 0; i < n - 1 && sum(cols) > W; i++) {
      const x = cols[i];
      if (x.bar || x.c.uid === s.source || s.pinned.has(x.c.uid)) continue;
      x.bar = true; x.auto = "auto"; x.w = BAR;
    }
    shrink(); // what still does not fit gives a little, before anything scrolls
  }

  const spare = W - sum(cols);
  if (spare > 0) leaf.w += spare; // the leaf takes what is left — never less than its own width
  return cols;
}

// What a reader would notice about one change: who resized, and how much of
// the new column and of the column you clicked in is on screen afterwards.
function report(before, after, W, sourceUid, newUid) {
  const lines = [];
  const prev = new Map(before.map((x) => [x.c.uid, x]));
  const total = sum(after);
  const scroll = Math.max(0, total - W);
  let x0 = 0;
  const vis = new Map();
  after.forEach((x) => {
    const a = Math.max(x0, scroll), b = Math.min(x0 + x.w, scroll + W);
    vis.set(x.c.uid, Math.max(0, b - a) / x.w);
    x0 += x.w;
  });
  after.forEach((x) => {
    const p = prev.get(x.c.uid);
    if (!p) return;
    const name = KINDS[x.c.kind].title(x.c.ref);
    if (p.bar !== x.bar) lines.push(["resized", `${name}: ${x.bar ? "collapsed" : "expanded"}`, x.bar ? "" : ""]);
    else if (Math.abs(p.w - x.w) > 1) lines.push(["resized", `${name}: ${p.w} → ${Math.round(x.w)}px`, ""]);
  });
  const pct = (v) => (v > 0.99 ? "fully on screen" : v < 0.01 ? "off screen" : `${Math.round(v * 100)}% on screen`);
  if (newUid !== null && vis.has(newUid)) {
    const v = vis.get(newUid);
    lines.push(["opened", pct(v), v > 0.99 ? "good" : "bad"]);
  }
  if (sourceUid !== null && vis.has(sourceUid)) {
    const v = vis.get(sourceUid);
    const x = after.find((y) => y.c.uid === sourceUid);
    lines.push(["clicked in", x.bar ? "collapsed" : pct(v), v > 0.99 && !x.bar ? "good" : "bad"]);
  }
  if (scroll > 0) lines.push(["row", `scrolled ${Math.round(scroll)}px`, ""]);
  return lines;
}

// ---------------------------------------------------------------- app
function App() {
  const [s, setS] = useState(() => ({
    chain: [slot("tasks", null), slot("task", "t1")],
    widths: {},                  // per pane kind, px — drag (and, today, the auto split)
    collapsed: new Set(),        // per column instance (proposed)
    kindCollapsed: new Set(),    // per pane kind (today)
    pinned: new Set(),           // columns the user expanded — auto-collapse skips them
    max: null, focus: null, source: null, fresh: null, seq: 0,
  }));
  const rowRef = useRef(null);
  const [W, setW] = useState(1200);
  const [rep, setRep] = useState(null);
  const [animated, setAnimated] = useState(false);
  const lastCols = useRef([]);
  const [dragging, setDragging] = useState(false);
  const [settled, setSettled] = useState(0);   // seq whose transition has finished
  const zoomFrom = useRef(0);                  // the row's scroll before a zoom, restored after it
  const prev = useRef({ max: null, chain: null });

  useLayoutEffect(() => {
    const el = rowRef.current;
    const ro = new ResizeObserver(() => setW(el.clientWidth));
    ro.observe(el);
    setW(el.clientWidth);
    requestAnimationFrame(() => setAnimated(MODE !== "current"));
    return () => ro.disconnect();
  }, []);

  const cols = useMemo(() => layout(s, W), [s, W]);

  // A change: report it against the layout before it, and reveal the end.
  const reportedSeq = useRef(0);
  useLayoutEffect(() => {
    // A window resize only re-lays out: it becomes the new "before".
    if (s.seq === reportedSeq.current) { lastCols.current = cols; return; }
    reportedSeq.current = s.seq;
    setRep({ seq: s.seq, lines: report(lastCols.current, cols, W, s.source, s.fresh), before: new Map(lastCols.current.map((y) => [y.c.uid, y])) });
    lastCols.current = cols;
    const el = rowRef.current;
    const end = Math.max(0, sum(cols) - W);
    // Leaving a zoom with nothing else changed puts the row back where it was;
    // anything else reveals the newest column.
    const unzoom = prev.current.max !== null && s.max === null && prev.current.chain === s.chain;
    const target = s.max !== null ? 0 : unzoom ? Math.min(end, zoomFrom.current) : end;
    prev.current = { max: s.max, chain: s.chain };
    const seq = s.seq;
    const t = setTimeout(() => setSettled(seq), DURATION + 20);
    if (MODE === "current") {
      el.scrollTo({ left: target, behavior: "smooth" }); // miller today: native smooth scroll, widths commit at once
      return () => clearTimeout(t);
    }
    const stop = glide(el, target);
    return () => { clearTimeout(t); stop?.(); };
  }, [cols]);

  const update = (fn) => setS((p) => { const n = { ...p }; if (fn(n) === false) return p; n.seq = p.seq + 1; return n; });
  const widthOf = (uid) => cols.find((x) => x.c.uid === uid)?.w ?? 0;

  const open = (fromIdx, kind, ref) => update((n) => {
    const next = n.chain[fromIdx + 1];
    if (next && next.kind === kind && next.ref === ref && fromIdx + 1 === n.chain.length - 1) return false;
    const caller = n.chain[fromIdx];
    if (MODE === "current" && fromIdx === n.chain.length - 1 && n.widths[caller.kind] === undefined) {
      // miller today: the leaf's first child splits it 50/50 — and stores it.
      n.widths = { ...n.widths, [caller.kind]: Math.max(LEAF_MIN, Math.round(widthOf(caller.uid) / 2)) };
    }
    const added = slot(kind, ref);
    n.chain = [...n.chain.slice(0, fromIdx + 1), added];
    n.source = caller.uid; n.fresh = added.uid;
    if (MODE !== "current") {
      n.max = null;
      if (n.focus !== null && !n.chain.some((c) => c.uid === n.focus)) n.focus = null;
      n.pinned = new Set([...n.pinned].filter((u) => n.chain.some((c) => c.uid === u)));
    }
  });
  const close = (i) => update((n) => {
    n.chain = n.chain.slice(0, i);
    n.source = null; n.fresh = null;
    if (MODE !== "current") { n.max = null; if (!n.chain.some((c) => c.uid === n.focus)) n.focus = null; }
  });
  const dblHeader = (uid) => {
    if (s.max === null) zoomFrom.current = rowRef.current.scrollLeft;
    dblHeaderUpdate(uid);
  };
  const dblHeaderUpdate = (uid) => update((n) => {
    n.source = null; n.fresh = null;
    if (MODE === "current" || DBL === "zoom") n.max = n.max === uid ? null : uid;
    else if (DBL === "focus") n.focus = n.focus === uid ? null : uid;
    else return false;
  });
  const expandBar = (x) => update((n) => {
    n.source = null; n.fresh = null;
    if (n.max !== null) { n.max = null; return; }
    if (MODE === "current") { n.kindCollapsed = new Set([...n.kindCollapsed].filter((k) => k !== x.c.kind)); return; }
    if (x.auto === "focus") { n.focus = null; return; }
    n.collapsed = new Set([...n.collapsed].filter((u) => u !== x.c.uid));
    n.pinned = new Set([...n.pinned, x.c.uid]);
  });
  const collapse = (x) => update((n) => {
    n.source = null; n.fresh = null;
    if (MODE === "current") n.kindCollapsed = new Set([...n.kindCollapsed, x.c.kind]);
    else { n.collapsed = new Set([...n.collapsed, x.c.uid]); n.pinned = new Set([...n.pinned].filter((u) => u !== x.c.uid)); }
  });
  const resize = (kind, w) => setS((p) => ({ ...p, widths: { ...p.widths, [kind]: Math.max(MIN, Math.round(w)) } }));
  const resetWidth = (kind) => update((n) => {
    n.source = null; n.fresh = null;
    const w = { ...n.widths }; delete w[kind]; n.widths = w;
  });

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") update((n) => { if (n.max === null) return false; n.max = null; n.source = null; n.fresh = null; }); };
    addEventListener("keydown", onKey);
    return () => removeEventListener("keydown", onKey);
  }, []);

  return (
    <div ref={rowRef} className={"row" + (animated ? " animated" : "") + (dragging ? " dragging" : "")}>
      <div className="track">
        {cols.map((x, i) => {
          const last = i === cols.length - 1;
          const before = rep?.seq === s.seq ? rep.before.get(x.c.uid) : undefined;
          const changed = before !== undefined && Math.abs(before.w - x.w) > 1;
          const title = KINDS[x.c.kind].title(x.c.ref);
          // While a column narrows, its content keeps its old width (clipped)
          // instead of re-wrapping every frame; it settles when the motion ends.
          const holding = before !== undefined && !before.bar && before.w > x.w && settled !== s.seq;
          const nextSlot = s.chain[i + 1];
          return (
            <section key={x.c.uid}
              className={["col", x.bar && "bar", i === 0 && "root", last && "last", s.source === x.c.uid && rep?.seq === s.seq && "flash"].filter(Boolean).join(" ")}
              style={{ width: x.w }}>
              {x.bar ? (
                <button className="barbtn" onClick={() => expandBar(x)} title={title}>
                  <span>›</span>
                  <span className="vt">{title}</span>
                  {x.auto && <span className="auto">{x.auto}</span>}
                </button>
              ) : (
                <div className={"inner" + (before?.bar ? " unfold" : "")} style={{ width: holding ? before.w : x.w }}>
                  <header className="head" onDoubleClick={(e) => { if (e.target.closest("button")) return; dblHeader(x.c.uid); }}>
                    <span className="title">{title}</span>
                    {s.max === x.c.uid && <span className="zoomed-tag">zoomed</span>}
                    <span className={"px" + (changed ? " changed" : "")}>{Math.round(x.w)}px</span>
                    {i > 0 && <button className="iconbtn" aria-label="Close" onClick={() => close(i)}>×</button>}
                  </header>
                  <div className={"body" + (s.fresh === x.c.uid && rep?.seq === s.seq ? " enter" : "")}>
                    <PaneBody slotx={x.c} next={nextSlot} open={(k, r) => open(i, k, r)} />
                  </div>
                </div>
              )}
              {!x.bar && !last && s.max === null && (
                <Divider onDrag={(w) => resize(x.c.kind, w)} start={() => x.w} onDragging={setDragging}
                  onReset={() => resetWidth(x.c.kind)} onCollapse={() => collapse(x)} />
              )}
            </section>
          );
        })}
      </div>
      {rep && rep.lines.length > 0 && (
        <div className="report" key={rep.seq}>
          {rep.lines.map(([tag, text, tone], k) => (
            <div className="line" key={k}><span className="tag">{tag}</span><span className={tone}>{text}</span></div>
          ))}
        </div>
      )}
    </div>
  );
}

function Divider({ onDrag, start, onReset, onCollapse, onDragging }) {
  const [drag, setDrag] = useState(false);
  const down = (e) => {
    if (e.target.closest(".chev")) return;
    e.preventDefault();
    const x0 = e.clientX, w0 = start();
    e.currentTarget.setPointerCapture(e.pointerId);
    setDrag(true); onDragging(true);
    const el = e.currentTarget;
    const move = (ev) => onDrag(w0 + ev.clientX - x0);
    const end = () => { setDrag(false); onDragging(false); el.removeEventListener("pointermove", move); el.removeEventListener("lostpointercapture", end); };
    el.addEventListener("pointermove", move);
    el.addEventListener("lostpointercapture", end);
  };
  return (
    <div className={"divider" + (drag ? " dragging" : "")} onPointerDown={down} onDoubleClick={onReset}>
      <button className="chev" aria-label="Collapse column" onClick={onCollapse}>‹</button>
    </div>
  );
}

function PaneBody({ slotx, next, open }) {
  const is = (k, r) => next && next.kind === k && next.ref === r;
  if (slotx.kind === "tasks") {
    return <div style={{ paddingTop: 6 }}>{Object.entries(TASKS).map(([id, t]) => (
      <div key={id} className={"item" + (is("task", id) ? " active" : "")} onClick={() => open("task", id)}>
        <span className="dot" style={{ background: STATUS[t.status] }} />
        <span className="t">{t.title}</span>
      </div>
    ))}</div>;
  }
  if (slotx.kind === "task") {
    const t = TASKS[slotx.ref];
    return <>
      <div className="prose">
        <div className="small muted" style={{ marginBottom: 6 }}><span className="dot" style={{ display: "inline-block", background: STATUS[t.status], marginRight: 6 }} />{t.status}</div>
        When a column opens, the columns already on screen should not jump under the pointer, and the new column should land fully visible at its own width.
      </div>
      <div className="section">Conversations</div>
      {t.convs.map((c) => (
        <div key={c} className={"item" + (is("conv", c) ? " active" : "")} onClick={() => open("conv", c)}>
          <span className="muted">💬</span><span className="t">{CONVS[c].title}</span>
        </div>
      ))}
      {t.subs.length > 0 && <div className="section">Subtasks</div>}
      {t.subs.map((id) => (
        <div key={id} className={"item" + (is("task", id) ? " active" : "")} onClick={() => open("task", id)}>
          <span className="dot" style={{ background: STATUS[TASKS[id].status] }} /><span className="t">{TASKS[id].title}</span>
        </div>
      ))}
    </>;
  }
  if (slotx.kind === "conv") {
    return <div style={{ paddingBottom: 16 }}>{CONVS[slotx.ref].msgs.map((m, k) => (
      <div key={k} className={"msg " + m.who}>
        <div className="who">{m.who === "user" ? "You" : "Agent"}</div>
        <div className="bubble">
          {m.text}{" "}
          {m.files?.map((f) => <span key={f} className={"chip" + (is("file", f) ? " active" : "")} onClick={() => open("file", f)}>{f.split("/").pop()}</span>)}
          {m.task && <span className={"chip task" + (is("task", m.task) ? " active" : "")} onClick={() => open("task", m.task)}>◆ {TASKS[m.task].title}</span>}
        </div>
      </div>
    ))}</div>;
  }
  return <pre className="code">{codeFor(slotx.ref).map((l, k) => <div key={k}><span className="ln">{k + 1}</span><span dangerouslySetInnerHTML={{ __html: l }} /></div>)}</pre>;
}

function codeFor(path) {
  const name = path.split("/").pop().replace(/\.tsx?$/, "");
  return [
    `<span class="k">import</span> { useLayoutEffect } <span class="k">from</span> <span class="s">"react"</span>;`,
    ``,
    `<span class="c">// ${name}</span>`,
    `<span class="k">export function</span> ${name.replace(/-./g, (m) => m[1].toUpperCase())}() {`,
    `  <span class="k">const</span> width = useColumnWidth(pane.id, <span class="s">400</span>);`,
    `  useLayoutEffect(() => {`,
    `    <span class="k">if</span> (!isLast &amp;&amp; !hasStoredWidth(tabId, paneId)) {`,
    `      setWidth(Math.round(captured / <span class="s">2</span>));`,
    `    }`,
    `  }, [isLast]);`,
    `  <span class="k">return</span> &lt;PaneBox style={{ width }} /&gt;;`,
    `}`,
  ];
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
