<!doctype html>
<html lang="en" data-density="cozy" style="--accent: #7c5cff">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipe box: home</title>
<meta name="description" content="The family recipes app's home: one card per recipe, each with a coloured edge." />
<meta name="prototype-option" content="density: cozy | compact" />
<meta name="prototype-option" content="accent: color violet=#7c5cff | teal=#14b8a6 | amber=#f59e0b" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="bar">
  <span class="brand">Recipe box</span>
  <span class="count" id="count"></span>
</header>
<main id="board" class="board"></main>
<script src="data.js"></script>
<script>
  const board = document.getElementById("board");
  for (const recipe of window.RECIPES) {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `<h2></h2><p></p>`;
    card.querySelector("h2").textContent = recipe.title;
    card.querySelector("p").textContent = recipe.body;
    board.append(card);
  }
  document.getElementById("count").textContent = `${window.RECIPES.length} recipes`;
</script>
</body>
</html>
