<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Layout harness measurer</title>
    <style>
      /*
       * Font determinism: text width and ink metrics differ from one face to
       * the next, so truncation onset and the optical centre move with the
       * font. Every node under `[data-geo-root]` is therefore drawn in ONE
       * face at 14px: the app's own text face (`--font-sans`, Inter, which
       * app.css bundles from fontsource) — the same bytes on every machine,
       * and the face the rows the suite gates are actually read in. Never a
       * generic family: `monospace` was Menlo on macOS and DejaVu Sans Mono
       * on Linux. entry.tsx loads this face before any fixture renders and
       * fails the page when it is not a bundled one.
       *
       * Why not Cascadia (the bundled monospace): a correctly built
       * glyph-and-words row reads 0.71px off-centre in it on macOS and 1.00px
       * on Linux (2026-11-18 — Linux draws it 0.29px higher), against
       * opticalCenter's 0.75px. In Inter the same row reads 0.24px, which
       * leaves the per-OS rendering difference inside the budget while the
       * real fault (~3px) stays far outside it.
       */
      [data-geo-root],
      [data-geo-root] * {
        font-family: var(--font-sans);
        font-size: 14px;
      }
      /*
       * Token VALUES (`--space-*`, pads, control heights, radius) are emitted at
       * RUNTIME by ThemeInjector — never in static CSS — so a page that loads only
       * app.css has them unset (a `gap: var(--space-sm)` collapses to 0). The
       * measured suite pins the DEFAULT density baseline (the same default the
       * bespoke geometry tests hardcoded as 8px), so we seed the default
       * `comfortable` density ramp + the radius/pad tokens the rendered primitives
       * need for faithful box geometry. `rem` is relative to the (un-overridden)
       * 16px html root, so 0.5rem = 8px etc.
       */
      [data-geo-root] {
        --space-2xs: 0.125rem;
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space-md: 0.75rem;
        --space-lg: 1rem;
        --space-xl: 1.5rem;
        --space-2xl: 2rem;
        --pad-chip-x: 0.375rem;
        --pad-chip-y: 0.125rem;
        --pad-row-x: 0.5rem;
        --pad-row-y: 0.375rem;
        --control-height-xs: 1.5rem;
        --control-height-sm: 1.75rem;
        --control-height-md: 2rem;
        --control-height-lg: 2.25rem;
        --control-pad-xs: 0.5rem;
        --control-pad-sm: 0.625rem;
        --control-pad-md: 0.625rem;
        --control-pad-lg: 0.625rem;
        --control-gap-xs: 0.25rem;
        --control-gap-sm: 0.25rem;
        --control-gap-md: 0.375rem;
        --control-gap-lg: 0.375rem;
        --radius: 0.625rem;
        --radius-popover: var(--radius);
        --radius-panel-row: calc(var(--radius) * 0.8);
        --panel-pad: var(--space-xs);
        --panel-row-h: var(--control-height-md);
        --popover-width-menu-min: 12.5rem;
        --popover-width-menu-max: 18.75rem;
        --popover-width-builder: 32.75rem;
        --popover-width-picker: 20rem;
        --popover-width-card: 15.75rem;
        --popover-width-described: 17.5rem;
        --chrome-pane-rule: 1px;
        --tree-row-h: 1.75rem;
        --tree-indent: 16px;
        --tree-root-gap: var(--space-2xs);
        --section-head-pad-top: var(--pad-row-y);
        --section-head-pad-bottom: var(--pad-row-y);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./entry.tsx"></script>
  </body>
</html>
