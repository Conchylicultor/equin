# Publishes a release tag's GitHub Release, then builds the equin installer
# window for it and attaches the binaries — in two phases:
#
# 1. `publish` (right after `validate`, ~1 min after the tag): the tag's
#    install.sh, release.json and SHA256SUMS, with their build-provenance
#    records (provenance.intoto.jsonl), published at once (draft → public).
#    These files are never changed afterwards: a client reading release.json
#    and SHA256SUMS on either side of a rewrite would see a mismatch.
# 2. `attach` (after the window's builds): the binaries, their own provenance
#    (installer-provenance.intoto.jsonl) and INSTALLER-SHA256SUMS, uploaded to
#    the existing Release — INSTALLER-SHA256SUMS last, so its presence means
#    every binary it lists is there.
#
# So a failed installer build no longer blocks the Release: the curl install's
# stage 0 finds no INSTALLER-SHA256SUMS and installs in the terminal view.
#
# - Runs on every pushed tag; only release tags (`./equin version cut`:
#   v<YYYY.MM.DD>[.N]) go further, any other tag ends here without error.
# - Run by hand (Actions → Installer release → Run workflow) to (re)attach the
#   installer to an existing Release (its core files are left alone), with
#   `replace` to republish the Release from scratch, or with `publish` off to
#   only build any ref and keep the binaries as run artifacts.
# - A tag cut before the installer window existed has no crate to build: its
#   Release carries install.sh, release.json and SHA256SUMS only, and the curl
#   install's stage 0 installs it in the terminal view.
#
# Contract (asset names, release.json, the hand-off marker):
# plugins/installer/plugins/release-assets. Design:
# research/2026-11-17-global-installer-window.md §6, and
# research/2026-11-18-global-github-release-events.md §4 (the two phases).

name: Installer release
# The run's title is the ref it builds — a manual run of a tag is dispatched
# FROM main, and equin's github-events reads the tag from here
# (GitHubWatch.headIsRunName).
run-name: ${{ inputs.ref || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build (with publish off: any branch, tag or commit)"
        required: true
        type: string
      publish:
        description: "Publish the tag's GitHub Release, or attach the installer to it if it exists (off: build only, binaries kept as run artifacts)"
        type: boolean
        default: true
      replace:
        description: "Replace the tag's existing GitHub Release (off: an existing Release keeps its files, and only gets the installer attached)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installer-release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  # The release tag grammar as a POSIX ERE. Must equal RELEASE_TAG_ERE in
  # plugins/upstream/plugins/release/core — the release-assets:tag-grammar
  # check holds the two equal.
  RELEASE_TAG_ERE: '^v([0-9]{4})\.([0-9]{2})\.([0-9]{2})(\.([0-9]+))?$'
  # The window's crate; a tag without it predates the installer window.
  CRATE: plugins/installer/plugins/window/rust
  # bun / rust at the exact versions mise.lock records (the repo's toolchain).
  # Read directly rather than through mise: `mise install` would also run the
  # repo's postinstall hooks (machine setup and the doctor), meant for a
  # developer's machine, not a build runner.
  READ_TOOL_VERSION: >-
    awk -v t="$TOOL" '$0 == "[[tools." t "]]" { f = 1; next }
    f && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' mise.lock

jobs:
  validate:
    name: Which ref, and what to build
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.decide.outputs.ref }}
      commit: ${{ steps.decide.outputs.commit }}
      build: ${{ steps.decide.outputs.build }}
      window: ${{ steps.decide.outputs.window }}
      publish: ${{ steps.decide.outputs.publish }}
      latest: ${{ steps.decide.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - id: decide
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          release=false
          if [[ $REF =~ $RELEASE_TAG_ERE ]]; then release=true; fi
          build=true
          publish=$PUBLISH
          if [ "$release" = false ]; then
            if [ "$EVENT" = push ]; then
              echo "::notice::$REF is not a release tag (v<YYYY.MM.DD>[.N]); nothing to build."
              build=false publish=false
            elif [ "$publish" = true ]; then
              echo "::error::Only a release tag (v<YYYY.MM.DD>[.N]) can be published; $REF is not one. Turn publish off to only build it."
              exit 1
            fi
          fi
          if [ "$release" = true ] && [ "$(git cat-file -t "refs/tags/$REF" 2>/dev/null)" != tag ]; then
            echo "::error::$REF is not an annotated tag: ./equin version cut writes every release tag annotated, and the Release's notes are its message."
            exit 1
          fi
          window=false
          if [ -f "$CRATE/Cargo.toml" ]; then window=true; fi
          if [ "$window" = false ]; then
            echo "::notice::$REF predates the installer window: its Release carries install.sh, release.json and SHA256SUMS only."
          fi
          newest="$(git tag -l 'v*' | grep -E "$RELEASE_TAG_ERE" | sort -V | tail -n 1)"
          latest=false
          if [ "$newest" = "$REF" ]; then latest=true; fi
          {
            echo "ref=$REF"
            echo "commit=$(git rev-parse HEAD)"
            echo "build=$build"
            echo "window=$window"
            echo "publish=$publish"
            echo "latest=$latest"
          } | tee -a "$GITHUB_OUTPUT"

  publish:
    name: Publish the Release
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.validate.outputs.ref }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit, for the assembling code: a manual rebuild of
      # a tag cut before it still assembles with today's code. The tag's files
      # are read from git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does the Release exist?
        id: existing
        env:
          REPLACE: ${{ inputs.replace || false }}
        run: |
          set -euo pipefail
          create=true
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REPLACE" = true ]; then
              echo "::notice::$TAG already has a Release: replacing it (replace is on)."
            else
              echo "::notice::$TAG already has a Release: its files are left as they are (turn replace on to republish it); only the installer is attached."
              create=false
            fi
          fi
          echo "create=$create" | tee -a "$GITHUB_OUTPUT"
      - if: steps.existing.outputs.create == 'true'
        id: versions
        run: echo "bun=$(TOOL=bun; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - if: steps.existing.outputs.create == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - if: steps.existing.outputs.create == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Assemble release.json and SHA256SUMS
        if: steps.existing.outputs.create == 'true'
        env:
          WINDOW: ${{ needs.validate.outputs.window }}
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/assets"
          mkdir -p "$ASSETS"
          git show "$COMMIT:install.sh" > "$ASSETS/install.sh"
          installers=()
          if [ "$WINDOW" = true ]; then installers=(--installers); fi
          bun plugins/installer/plugins/release-assets/scripts/assemble.ts \
            --mode core --tag "$TAG" --commit "$COMMIT" --dir "$ASSETS" \
            ${installers[@]+"${installers[@]}"}
      - id: attest
        if: steps.existing.outputs.create == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/assets/*
      - name: Publish (draft, every file, then public)
        if: steps.existing.outputs.create == 'true'
        env:
          LATEST: ${{ needs.validate.outputs.latest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/assets"
          cp "$BUNDLE" "$ASSETS/provenance.intoto.jsonl"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          # A draft is invisible, so `releases/latest` never names a Release
          # whose files are still uploading: it turns public with all of them.
          gh release create "$TAG" "$ASSETS"/* --draft --verify-tag --notes-from-tag \
            --title "equin ${TAG#v}"
          gh release edit "$TAG" --draft=false --latest="$LATEST"
          gh release view "$TAG"

  page:
    name: Installer page
    needs: validate
    if: needs.validate.outputs.build == 'true' && needs.validate.outputs.window == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - id: versions
        run: echo "bun=$(TOOL=bun; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      # --ignore-scripts: the repo's postinstall provisions a developer's
      # machine; bundling the page needs the packages only.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun plugins/installer/plugins/window/scripts/bundle-page.ts "$RUNNER_TEMP/page.html"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-page
          path: ${{ runner.temp }}/page.html
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: [validate, page]
    runs-on: macos-15
    env:
      ASSET: equin-installer-macos-universal
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - id: versions
        run: echo "rust=$(TOOL=rust; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/download-artifact@v8
        with:
          name: installer-page
          path: ${{ runner.temp }}/page
      - name: Build both architectures
        env:
          EQUIN_INSTALLER_PAGE: ${{ runner.temp }}/page/page.html
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --manifest-path "$CRATE/Cargo.toml" --locked --release --target "$target"
          done
      - name: One universal binary, ad-hoc signed
        # lipo drops the linker's per-architecture ad-hoc signatures, and
        # arm64 macOS refuses to run unsigned code: sign the result. Ad-hoc is
        # enough for curl delivery (a curl download is never quarantined, so
        # Gatekeeper never assesses it).
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist/$ASSET"
          mkdir -p "$(dirname "$out")"
          lipo -create -output "$out" \
            "$CRATE/target/aarch64-apple-darwin/release/equin-installer" \
            "$CRATE/target/x86_64-apple-darwin/release/equin-installer"
          codesign --force --sign - "$out"
          codesign --verify --verbose "$out"
          archs="$(lipo -archs "$out")"
          echo "architectures: $archs"
          case " $archs " in *" x86_64 "*) ;; *) exit 1 ;; esac
          case " $archs " in *" arm64 "*) ;; *) exit 1 ;; esac
      - name: Smoke test
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/dist/$ASSET" --version
          "$RUNNER_TEMP/dist/$ASSET" --probe
          arch -x86_64 "$RUNNER_TEMP/dist/$ASSET" --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.platform }})
    needs: [validate, page]
    strategy:
      matrix:
        include:
          # 22.04: a glibc 2.35 baseline, and webkit2gtk-4.1.
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: equin-installer-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - id: versions
        run: echo "rust=$(TOOL=rust; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb
      - uses: actions/download-artifact@v8
        with:
          name: installer-page
          path: ${{ runner.temp }}/page
      - name: Build
        env:
          EQUIN_INSTALLER_PAGE: ${{ runner.temp }}/page/page.html
        run: |
          set -euo pipefail
          cargo build --manifest-path "$CRATE/Cargo.toml" --locked --release
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$CRATE/target/release/equin-installer" "$RUNNER_TEMP/dist/$ASSET"
      - name: Smoke test
        # Inside a session bus, as on any desktop: without one (xvfb-run
        # starts none) WebKitGTK blocks its main thread on D-Bus timeouts for
        # ~30 s, past the probe's deadline — stage 0 never tries the window
        # there (install.sh, choose_view).
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/dist/$ASSET"
          "$bin" --version
          dbus-run-session -- xvfb-run -a "$bin" --probe
          # The real window over a dry run: every step's event reaches it.
          # It stays open on its done screen, so `timeout` stops it (SIGTERM:
          # the window exits with the script's code; xvfb-run then ends).
          set +e
          EQUIN_INSTALL_DRY_RUN_PACE=0 dbus-run-session -- xvfb-run -a timeout 60 "$bin" --script install.sh -- --dry-run | tee "$RUNNER_TEMP/window.out"
          set -e
          # The last step's line: every event before it reached the window.
          # (A step with sub-steps prints as a bare heading, never a ✓ line.)
          grep -qE '✓ Start equin$' "$RUNNER_TEMP/window.out"
      - name: Without webkit2gtk, the probe fails (stage 0 then uses the terminal)
        run: |
          set +e
          docker run --rm -v "$RUNNER_TEMP/dist:/dist:ro" ubuntu:22.04 "/dist/$ASSET" --probe
          code=$?
          set -e
          echo "probe exit code without webkit2gtk: $code"
          [ "$code" != 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error

  attach:
    name: Attach the installer
    needs: [validate, publish, macos, linux]
    # Only after the Release is published and every platform built: a partial
    # set would be a window for some systems and none for others.
    if: needs.validate.outputs.window == 'true' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.validate.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit, for the assembling code (as in publish).
      - uses: actions/checkout@v7
      - id: versions
        run: echo "bun=$(TOOL=bun; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: equin-installer-*
          merge-multiple: true
          path: ${{ runner.temp }}/installers
      - name: Assemble INSTALLER-SHA256SUMS
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/installers"/equin-installer-*
          bun plugins/installer/plugins/release-assets/scripts/assemble.ts \
            --mode installer --dir "$RUNNER_TEMP/installers"
      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/installers/*
      - name: Upload (binaries, provenance, INSTALLER-SHA256SUMS last)
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/installers"
          cp "$BUNDLE" "$RUNNER_TEMP/installer-provenance.intoto.jsonl"
          # INSTALLER-SHA256SUMS last: stage 0 reads its presence as "every
          # binary it lists is uploaded". A re-run first removes it, so no
          # client pairs the old sums with a new binary mid-upload.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx INSTALLER-SHA256SUMS; then
            gh release delete-asset "$TAG" INSTALLER-SHA256SUMS --yes
          fi
          gh release upload "$TAG" --clobber "$DIR"/equin-installer-*
          gh release upload "$TAG" --clobber "$RUNNER_TEMP/installer-provenance.intoto.jsonl"
          gh release upload "$TAG" --clobber "$DIR/INSTALLER-SHA256SUMS"
          gh release view "$TAG"
