# Publishes a release tag's GitHub Release, then builds the equin installer
# window for it and attaches the binaries. What each job does, and why:
# plugins/installer/plugins/release-assets (its CLAUDE.md; the contract —
# asset names, release.json, the hand-off marker — is its core/).
#
# THIS FILE IS A WRAPPER: the release logic lives in
# plugins/installer/plugins/release-assets/scripts/ (one script per step, the
# settings — WINDOW_ON_TAGS, RELEASE_TAG_ERE, CRATE — in release-config.sh).
# Edit this file only to change triggers, inputs, the job graph, runners,
# permissions or the `uses:` actions. GitHub refuses an HTTPS push that adds
# or edits a file under .github/workflows/ unless the token has the
# `workflow` scope (`gh auth login` does not grant it), and every clone
# merges upstream's releases and pushes them to its own GitHub repo — so each
# edit here breaks every user's next push.
#
# Every job runs its scripts from THIS WORKFLOW's own commit (github.sha),
# checked out sparse into .release-ci — never from the ref it builds: a
# manual run of a tag cut before the scripts existed (dispatched from main)
# still has them, and runs today's release logic over that tag's tree (its
# install.sh, mise.lock, page bundler and crate). So a script must keep
# working over the trees of older tags, and moving the scripts directory is
# the one logic change that edits this file (SCRIPTS below).
#
# - Runs on every pushed tag; only release tags (`./equin version cut`:
#   v<YYYY.MM.DD>[.N]) go further, any other tag ends here without error.
# - Run by hand (Actions → Installer release → Run workflow) to (re)attach the
#   installer to an existing Release (its core files are left alone), with
#   `replace` to republish the Release from scratch, or with `publish` off to
#   only build any ref and keep the binaries as run artifacts.
#
# Design: research/2026-11-17-global-installer-window.md §6, and
# research/2026-11-18-global-github-release-events.md §4 (the two phases).

name: Installer release
# The run's title is the ref it builds — a manual run of a tag is dispatched
# FROM main, and equin's github-events reads the tag from here
# (GitHubWatch.headIsRunName).
run-name: ${{ inputs.ref || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build (with publish off: any branch, tag or commit)"
        required: true
        type: string
      publish:
        description: "Publish the tag's GitHub Release, or attach the installer to it if it exists (off: build only, binaries kept as run artifacts)"
        type: boolean
        default: true
      replace:
        description: "Replace the tag's existing GitHub Release (off: an existing Release keeps its files, and only gets the installer attached)"
        type: boolean
        default: false
      window:
        description: "Build the installer window (off: the Release carries install.sh, release.json and SHA256SUMS only — the install is terminal-only for now)"
        type: boolean
        default: false
      retried:
        description: "Set by the workflow itself when it re-runs a build that never got a runner (at most once): this run does not re-run again"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installer-release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  # Where every job's `.release-ci` checkout puts the release scripts.
  SCRIPTS: .release-ci/plugins/installer/plugins/release-assets/scripts

jobs:
  validate:
    name: Which ref, and what to build
    # Only the canonical repo publishes equin releases. A clone that tracks
    # upstream carries this file unchanged (dropping it would conflict with
    # every later upstream merge), so in the clone's own GitHub repo a pushed
    # `v*` tag would otherwise publish a "release" of that copy. Every other
    # job needs this one, so skipping it skips the run. The repository is
    # SOURCE_REPO (plugins/framework/plugins/product-name), spelled out here
    # because a workflow cannot import it.
    if: github.repository == 'equinai/equin'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.decide.outputs.ref }}
      commit: ${{ steps.decide.outputs.commit }}
      build: ${{ steps.decide.outputs.build }}
      window: ${{ steps.decide.outputs.window }}
      publish: ${{ steps.decide.outputs.publish }}
      latest: ${{ steps.decide.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: plugins/installer/plugins/release-assets/scripts
          persist-credentials: false
      - id: decide
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_WINDOW: ${{ inputs.window }}
        run: bash "$SCRIPTS/decide.sh"

  publish:
    name: Publish the Release
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.validate.outputs.ref }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit, for the assembling code: a manual rebuild of
      # a tag cut before it still assembles with today's code. The tag's files
      # are read from git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: plugins/installer/plugins/release-assets/scripts
          persist-credentials: false
      - name: Does the Release exist?
        id: existing
        env:
          REPLACE: ${{ inputs.replace }}
        run: bash "$SCRIPTS/publish-existing.sh"
      - if: steps.existing.outputs.create == 'true'
        id: versions
        run: bash "$SCRIPTS/tool-version.sh" bun
      - if: steps.existing.outputs.create == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - if: steps.existing.outputs.create == 'true'
        run: bash "$SCRIPTS/bun-install.sh"
      - name: Assemble release.json and SHA256SUMS
        if: steps.existing.outputs.create == 'true'
        env:
          WINDOW: ${{ needs.validate.outputs.window }}
        run: bash "$SCRIPTS/publish-assemble.sh"
      - id: attest
        if: steps.existing.outputs.create == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/assets/*
      - name: Publish (draft, every file, then public)
        if: steps.existing.outputs.create == 'true'
        env:
          LATEST: ${{ needs.validate.outputs.latest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: bash "$SCRIPTS/publish-release.sh"

  page:
    name: Installer page
    needs: validate
    if: needs.validate.outputs.build == 'true' && needs.validate.outputs.window == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: plugins/installer/plugins/release-assets/scripts
          persist-credentials: false
      - id: versions
        run: bash "$SCRIPTS/tool-version.sh" bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - run: bash "$SCRIPTS/bun-install.sh"
      - run: bash "$SCRIPTS/page-bundle.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-page
          path: ${{ runner.temp }}/page.html
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: [validate, page]
    runs-on: macos-15
    env:
      ASSET: equin-installer-macos-universal
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: plugins/installer/plugins/release-assets/scripts
          persist-credentials: false
      - id: versions
        run: bash "$SCRIPTS/tool-version.sh" rust
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/download-artifact@v8
        with:
          name: installer-page
          path: ${{ runner.temp }}/page
      - name: Build both architectures
        env:
          EQUIN_INSTALLER_PAGE: ${{ runner.temp }}/page/page.html
        run: bash "$SCRIPTS/macos-build.sh"
      - name: One universal binary, ad-hoc signed
        run: bash "$SCRIPTS/macos-universal.sh"
      - name: Smoke test
        run: bash "$SCRIPTS/macos-smoke.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.platform }})
    needs: [validate, page]
    strategy:
      matrix:
        include:
          # 22.04: a glibc 2.35 baseline, and webkit2gtk-4.1.
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: equin-installer-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: plugins/installer/plugins/release-assets/scripts
          persist-credentials: false
      - id: versions
        run: bash "$SCRIPTS/tool-version.sh" rust
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
      - run: bash "$SCRIPTS/linux-deps.sh"
      - uses: actions/download-artifact@v8
        with:
          name: installer-page
          path: ${{ runner.temp }}/page
      - name: Build
        env:
          EQUIN_INSTALLER_PAGE: ${{ runner.temp }}/page/page.html
        run: bash "$SCRIPTS/linux-build.sh"
      - name: Smoke test
        run: bash "$SCRIPTS/linux-smoke.sh"
      - name: Without webkit2gtk, the probe fails (stage 0 then uses the terminal)
        run: bash "$SCRIPTS/linux-no-webkit.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error

  attach:
    name: Attach the installer
    needs: [validate, publish, macos, linux]
    # Only after the Release is published and every platform built: a partial
    # set would be a window for some systems and none for others.
    if: needs.validate.outputs.window == 'true' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.validate.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit, for the assembling code (as in publish).
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: plugins/installer/plugins/release-assets/scripts
          persist-credentials: false
      - id: versions
        run: bash "$SCRIPTS/tool-version.sh" bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - run: bash "$SCRIPTS/bun-install.sh"
      - uses: actions/download-artifact@v8
        with:
          pattern: equin-installer-*
          merge-multiple: true
          path: ${{ runner.temp }}/installers
      - name: Assemble INSTALLER-SHA256SUMS
        run: bash "$SCRIPTS/attach-assemble.sh"
      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/installers/*
      - name: Upload (binaries, provenance, INSTALLER-SHA256SUMS last)
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: bash "$SCRIPTS/attach-upload.sh"

  # Runs whatever the builds did, once the Release exists: the Release's notes
  # say whether its window is attached, and a build GitHub never gave a runner
  # is re-run once (release-status-mark.sh).
  release-status:
    name: Is the window attached?
    needs: [validate, publish, page, macos, linux, attach]
    if: >-
      always() && needs.validate.outputs.window == 'true' &&
      needs.validate.outputs.publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
    env:
      TAG: ${{ needs.validate.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ATTACH: ${{ needs.attach.result }}
      RETRIED: ${{ inputs.retried }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-ci
          sparse-checkout: plugins/installer/plugins/release-assets/scripts
          persist-credentials: false
      - name: Mark the Release
        id: mark
        run: bash "$SCRIPTS/release-status-mark.sh"
      - name: Re-run the attach once
        if: ${{ failure() && steps.mark.outputs.retry == 'true' }}
        run: bash "$SCRIPTS/release-status-retry.sh"
