# Builds the equin installer window for a release tag and publishes it, with
# the tag's install.sh, release.json, SHA256SUMS and build-provenance records,
# as that tag's GitHub Release — every file at once.
#
# - Runs on every pushed tag; only release tags (`./equin version cut`:
#   v<YYYY.MM.DD>[.N]) go further, any other tag ends here without error.
# - Run by hand (Actions → Installer release → Run workflow) to rebuild an
#   existing tag (`replace` swaps out its current Release), or with `publish`
#   off to only build any ref and keep the binaries as run artifacts.
# - A tag cut before the installer window existed has no crate to build: its
#   Release carries install.sh, release.json and SHA256SUMS only, and the curl
#   install's stage 0 installs it in the terminal view.
#
# Contract (asset names, release.json, the hand-off marker):
# plugins/installer/plugins/release-assets. Design:
# research/2026-11-17-global-installer-window.md §6.

name: Installer release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build (with publish off: any branch, tag or commit)"
        required: true
        type: string
      publish:
        description: "Publish the tag's GitHub Release (off: build only, binaries kept as run artifacts)"
        type: boolean
        default: true
      replace:
        description: "Replace the tag's existing GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installer-release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  # The release tag grammar as a POSIX ERE. Must equal RELEASE_TAG_ERE in
  # plugins/upstream/plugins/release/core — the release-assets:tag-grammar
  # check holds the two equal.
  RELEASE_TAG_ERE: '^v([0-9]{4})\.([0-9]{2})\.([0-9]{2})(\.([0-9]+))?$'
  # The window's crate; a tag without it predates the installer window.
  CRATE: plugins/installer/plugins/window/rust
  # bun / rust at the exact versions mise.lock records (the repo's toolchain).
  # Read directly rather than through mise: `mise install` would also run the
  # repo's postinstall hooks (machine setup and the doctor), meant for a
  # developer's machine, not a build runner.
  READ_TOOL_VERSION: >-
    awk -v t="$TOOL" '$0 == "[[tools." t "]]" { f = 1; next }
    f && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' mise.lock

jobs:
  validate:
    name: Which ref, and what to build
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.decide.outputs.ref }}
      commit: ${{ steps.decide.outputs.commit }}
      build: ${{ steps.decide.outputs.build }}
      window: ${{ steps.decide.outputs.window }}
      publish: ${{ steps.decide.outputs.publish }}
      latest: ${{ steps.decide.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - id: decide
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          release=false
          if [[ $REF =~ $RELEASE_TAG_ERE ]]; then release=true; fi
          build=true
          publish=$PUBLISH
          if [ "$release" = false ]; then
            if [ "$EVENT" = push ]; then
              echo "::notice::$REF is not a release tag (v<YYYY.MM.DD>[.N]); nothing to build."
              build=false publish=false
            elif [ "$publish" = true ]; then
              echo "::error::Only a release tag (v<YYYY.MM.DD>[.N]) can be published; $REF is not one. Turn publish off to only build it."
              exit 1
            fi
          fi
          if [ "$release" = true ] && [ "$(git cat-file -t "refs/tags/$REF" 2>/dev/null)" != tag ]; then
            echo "::error::$REF is not an annotated tag: ./equin version cut writes every release tag annotated, and the Release's notes are its message."
            exit 1
          fi
          window=false
          if [ -f "$CRATE/Cargo.toml" ]; then window=true; fi
          if [ "$window" = false ]; then
            echo "::notice::$REF predates the installer window: its Release carries install.sh, release.json and SHA256SUMS only."
          fi
          newest="$(git tag -l 'v*' | grep -E "$RELEASE_TAG_ERE" | sort -V | tail -n 1)"
          latest=false
          if [ "$newest" = "$REF" ]; then latest=true; fi
          {
            echo "ref=$REF"
            echo "commit=$(git rev-parse HEAD)"
            echo "build=$build"
            echo "window=$window"
            echo "publish=$publish"
            echo "latest=$latest"
          } | tee -a "$GITHUB_OUTPUT"

  page:
    name: Installer page
    needs: validate
    if: needs.validate.outputs.build == 'true' && needs.validate.outputs.window == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - id: versions
        run: echo "bun=$(TOOL=bun; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      # --ignore-scripts: the repo's postinstall provisions a developer's
      # machine; bundling the page needs the packages only.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun plugins/installer/plugins/window/scripts/bundle-page.ts "$RUNNER_TEMP/page.html"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-page
          path: ${{ runner.temp }}/page.html
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: [validate, page]
    runs-on: macos-15
    env:
      ASSET: equin-installer-macos-universal
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - id: versions
        run: echo "rust=$(TOOL=rust; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/download-artifact@v8
        with:
          name: installer-page
          path: ${{ runner.temp }}/page
      - name: Build both architectures
        env:
          EQUIN_INSTALLER_PAGE: ${{ runner.temp }}/page/page.html
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --manifest-path "$CRATE/Cargo.toml" --locked --release --target "$target"
          done
      - name: One universal binary, ad-hoc signed
        # lipo drops the linker's per-architecture ad-hoc signatures, and
        # arm64 macOS refuses to run unsigned code: sign the result. Ad-hoc is
        # enough for curl delivery (a curl download is never quarantined, so
        # Gatekeeper never assesses it).
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist/$ASSET"
          mkdir -p "$(dirname "$out")"
          lipo -create -output "$out" \
            "$CRATE/target/aarch64-apple-darwin/release/equin-installer" \
            "$CRATE/target/x86_64-apple-darwin/release/equin-installer"
          codesign --force --sign - "$out"
          codesign --verify --verbose "$out"
          archs="$(lipo -archs "$out")"
          echo "architectures: $archs"
          case " $archs " in *" x86_64 "*) ;; *) exit 1 ;; esac
          case " $archs " in *" arm64 "*) ;; *) exit 1 ;; esac
      - name: Smoke test
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/dist/$ASSET" --version
          "$RUNNER_TEMP/dist/$ASSET" --probe
          arch -x86_64 "$RUNNER_TEMP/dist/$ASSET" --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.platform }})
    needs: [validate, page]
    strategy:
      matrix:
        include:
          # 22.04: a glibc 2.35 baseline, and webkit2gtk-4.1.
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: equin-installer-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - id: versions
        run: echo "rust=$(TOOL=rust; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb
      - uses: actions/download-artifact@v8
        with:
          name: installer-page
          path: ${{ runner.temp }}/page
      - name: Build
        env:
          EQUIN_INSTALLER_PAGE: ${{ runner.temp }}/page/page.html
        run: |
          set -euo pipefail
          cargo build --manifest-path "$CRATE/Cargo.toml" --locked --release
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$CRATE/target/release/equin-installer" "$RUNNER_TEMP/dist/$ASSET"
      - name: Smoke test
        # A fresh runner has no font cache: WebKit builds it on first use, on
        # the window's main thread, for longer than the probe's deadline (the
        # first probes on a runner never even started loading the page, and a
        # window drew nothing for 30 s). A desktop has one; build it first.
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/dist/$ASSET"
          "$bin" --version
          fc-cache
          xvfb-run -a "$bin" --probe
          # The real window over a dry run: every step's event reaches it.
          # It stays open on its done screen, so `timeout` stops it (SIGTERM:
          # the window exits with the script's code; xvfb-run then ends).
          set +e
          EQUIN_INSTALL_DRY_RUN_PACE=0 xvfb-run -a timeout 60 "$bin" --script install.sh -- --dry-run | tee "$RUNNER_TEMP/window.out"
          set -e
          grep -q '✓ Build equin' "$RUNNER_TEMP/window.out"
      - name: Without webkit2gtk, the probe fails (stage 0 then uses the terminal)
        run: |
          set +e
          docker run --rm -v "$RUNNER_TEMP/dist:/dist:ro" ubuntu:22.04 "/dist/$ASSET" --probe
          code=$?
          set -e
          echo "probe exit code without webkit2gtk: $code"
          [ "$code" != 0 ]
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish the Release
    needs: [validate, page, macos, linux]
    # A tag without the window skips the three builds; one with it needs all.
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.publish == 'true'
      && (needs.validate.outputs.window != 'true'
          || (needs.macos.result == 'success' && needs.linux.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.validate.outputs.ref }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit, for the assembling code: a manual rebuild of
      # a tag cut before it still assembles with today's code. The tag's files
      # are read from git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: versions
        run: echo "bun=$(TOOL=bun; eval "$READ_TOOL_VERSION")" | tee -a "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: needs.validate.outputs.window == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: equin-installer-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - name: Assemble release.json and SHA256SUMS
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/assets"
          mkdir -p "$ASSETS"
          chmod +x "$ASSETS"/equin-installer-* 2>/dev/null || true
          git show "$COMMIT:install.sh" > "$ASSETS/install.sh"
          bun plugins/installer/plugins/release-assets/scripts/assemble.ts \
            --tag "$TAG" --commit "$COMMIT" --dir "$ASSETS"
      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/assets/*
      - name: Publish (draft, every file, then public)
        env:
          LATEST: ${{ needs.validate.outputs.latest }}
          REPLACE: ${{ inputs.replace || false }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/assets"
          cp "$BUNDLE" "$ASSETS/provenance.intoto.jsonl"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REPLACE" != true ]; then
              echo "::error::$TAG already has a Release. Run the workflow by hand with replace on to rebuild it."
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          # A draft is invisible, so `releases/latest` never names a Release
          # whose files are still uploading: it turns public with all of them.
          gh release create "$TAG" "$ASSETS"/* --draft --verify-tag --notes-from-tag \
            --title "equin ${TAG#v}"
          gh release edit "$TAG" --draft=false --latest="$LATEST"
          gh release view "$TAG"
